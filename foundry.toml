# Foundry configuration — UHI11 Shared Liquidity Backplane
# Compiler settings mirror pinned v4-core (solc 0.8.26, cancun, via-IR) so that the
# PoolManager under test is compiled the same way upstream compiles it.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"        # transient storage (EIP-1153) is required by PoolManager
via_ir = true
optimizer = true
optimizer_runs = 44444444
bytecode_hash = "none"
ffi = false
# Tests may read build artifacts so that test/bench/ can deploy the production artifact files by path, independent of
# the optimizer profile the test file itself is compiled under, and the integer conformance vectors the Python model
# writes (test/pricing/ checks the Solidity against them). Read-only; nothing else.
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./simulations/mm/vectors" }]

# The vault alone is compiled with optimizer_runs = 200. With the market-risk boundary its runtime is 22,249 bytes
# at 200 runs, 2,327 bytes under the EIP-170 limit (24,576); at 2,000 runs the same source is over the limit. The cost
# is a little more gas per call than at higher settings (measured by test/bench/run.sh). Everything else, including
# the hooks, keeps the setting above.
#
# solc compiles a file together with its imports, so every test file that imports the vault (and with it the
# PoolManager, hooks and routers that file imports) is also built with 200 runs. Behaviour is the same; gas
# measured in those files is not the production gas. test/bench/ deploys the production builds instead.
additional_compiler_profiles = [{ name = "vault", optimizer_runs = 200 }]
compilation_restrictions = [{ paths = "src/SharedCommitmentVault.sol", optimizer_runs = 200 }]

gas_reports = ["SharedCommitmentVault", "HookA_DynamicFee", "HookB_BoundedImpact", "PoolManager"]

# Three test profiles (docs/security/G01_BASELINE.md §3). Each is selected with FOUNDRY_PROFILE; every one uses the
# same compiler settings, so only the fuzzing effort differs.
#   default  fast development suite:    fuzz 1,000 runs; invariants 64 runs x depth 64     (`forge test`)
#   ci       CI suite (test/bench/security.sh, .github/workflows/security.yml):
#                                        fuzz 10,000 runs; invariants 128 runs x depth 128
#   deep     adversarial / release suite (test/deep.sh, never run by CI):
#                                        fuzz 10,000 runs; invariants 1,000 runs x depth 256 (release checklist I-5),
#                                        plus test/deep.sh's extra seeds, the coverage gate and the fork tests when an
#                                        RPC is provided
# The seed is fixed so that a result can be reproduced; test/deep.sh adds further seeds explicitly.
# fail_on_revert = true in every profile: each handler catches the reverts it expects, so a revert reaching the
# fuzzer is a broken handler call that would otherwise be dropped silently and make a campaign look busier than it is.

[profile.default.fuzz]
runs = 1000
seed = "0x5eed"               # deterministic fuzzing

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 10000
seed = "0x5eed"

[profile.ci.invariant]
runs = 128
depth = 128
fail_on_revert = true

[profile.deep.fuzz]
runs = 10000
seed = "0x5eed"

[profile.deep.invariant]
runs = 1000
depth = 256
fail_on_revert = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = false

[lint]
# Lint production code only. Test files intentionally use bounded casts and test-only routers.
# The remaining src/ `block-timestamp` notes are intentional (expiry/deadline semantics) and stay visible.
ignore = ["test/**/*.sol"]
