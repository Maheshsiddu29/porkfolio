# Production-build security suite: formatting, sizes and gas on the production artifacts (test/bench/run.sh), then
# the security tests and the complete suite on those artifacts (test/bench/security.sh), then the invariant activity
# gate (test/invariant/coverage.py). See test/bench/README.md.
#
# It only builds and tests. It deploys nothing, broadcasts nothing, publishes nothing, pushes nothing, needs no
# secrets and makes no RPC calls (ffi is off and no test forks a chain). The token is read-only and is not kept in
# the checkout. Actions are pinned to full commit SHAs and Foundry to an exact release.
name: security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
          cache: false

      - name: Formatting
        run: forge fmt --check

      - name: Artifact settings, sizes and gas (production builds)
        run: test/bench/run.sh

      # security.sh fails if the vault has less than 2,048 bytes of EIP-170 margin, if any production contract
      # exceeds EIP-170 or EIP-3860, or if any test fails. Running it locally reproduces this step exactly.
      - name: Size gate and production-build security suite (CI fuzz profile)
        run: test/bench/security.sh

      # Non-vacuity gate: 64 single-run campaigns per invariant suite (about 90 s, reuses the build above). Fails if
      # an operation (swap, queued withdrawal, claim, fill, loosening...) succeeds in too few runs, or if a counter
      # that must stay zero is not. Reproducible: profile and fuzzer settings are pinned in the script.
      - name: Invariant campaign activity gate
        run: python3 test/invariant/coverage.py
